# Nombre de la aplicacion
spring.application.name=productos-app

# Base de datos H2 en memoria (ideal para el quiz, no requiere instalacion)
spring.datasource.url=jdbc:h2:mem:productosdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2 disponible en http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Hibernate crea/actualiza las tablas automaticamente segun la entidad
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
